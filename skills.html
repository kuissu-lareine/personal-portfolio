<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>KUISSU LAREINE| Software Engineer</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #0a192f;
      color: #ccd6f6;
      line-height: 1.6;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: min(1100px, 90%);
      margin: auto;
    }

    /* Navigation */
    nav {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(10, 25, 47, 0.95);
      border-bottom: 1px solid #233554;
      backdrop-filter: blur(10px);
    }

    nav .container {
      height: 70px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 1.4rem;
      font-weight: bold;
      color: #64ffda;
    }

    .nav-links {
      display: flex;
      gap: 25px;
      list-style: none;
    }

    .nav-links a {
      color: #ccd6f6;
      transition: 0.3s;
    }

    .nav-links a:hover {
      color: #64ffda;
    }

    /* Hero */
    .hero {
      min-height: 90vh;
      display: flex;
      align-items: center;
    }

    .hero-content {
      max-width: 750px;
    }

    .hero small {
      color: #64ffda;
      font-size: 1rem;
    }

    .hero h1 {
      font-size: clamp(3rem, 8vw, 5rem);
      color: #ccd6f6;
      margin: 10px 0;
    }

    .hero h2 {
      font-size: clamp(1.8rem, 4vw, 3rem);
      color: #8892b0;
      margin-bottom: 20px;
    }

    .hero p {
      max-width: 650px;
      color: #8892b0;
      font-size: 1.1rem;
      margin-bottom: 30px;
    }

    .buttons {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-block;
      padding: 12px 22px;
      border: 1px solid #64ffda;
      color: #64ffda;
      border-radius: 5px;
      transition: 0.3s;
    }

    .btn:hover {
      background: rgba(100, 255, 218, 0.1);
      transform: translateY(-2px);
    }

    .btn-primary {
      background: #64ffda;
      color: #0a192f;
      font-weight: bold;
    }

    .btn-primary:hover {
      background: #52d9b8;
    }
/* Skills */
    .skills {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .skill {
      background: #112240;
      color: #64ffda;
      padding: 10px 16px;
      border-radius: 5px;
      border: 1px solid #233554;
    }
</style>
</head>
 <!-- Skills -->
    <section id="skills">

      <div class="container">

        <h2 class="section-title">
          <span>04.</span> Skills
        </h2>

        <div class="skills">

          <span class="skill">JavaScript</span>
          <span class="skill">HTML</span>
          <span class="skill">CSS</span>
          <span class="skill">Next.js</span>
          <span class="skill">Node.js</span>
          <span class="skill">Python</span>
          <span class="skill">FastAPI</span>
          <span class="skill">PostgreSQL</span>
          <span class="skill">MongoDB</span>
          <span class="skill">Cisco packet tracer</span>
          <span class="skill">AWS</span>
          <span class="skill">Git</span>
          <span class="skill">REST APIs</span>
          <span class="skill">DEV C++</span>

        </div>

      </div>

    </section>
