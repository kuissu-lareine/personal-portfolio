 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>KUISSU LAREINE| Software Engineer</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #0a192f;
      color: #ccd6f6;
      line-height: 1.6;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: min(1100px, 90%);
      margin: auto;
    }

    /* Navigation */
    nav {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(10, 25, 47, 0.95);
      border-bottom: 1px solid #233554;
      backdrop-filter: blur(10px);
    }

    nav .container {
      height: 70px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 1.4rem;
      font-weight: bold;
      color: #64ffda;
    }

    .nav-links {
      display: flex;
      gap: 25px;
      list-style: none;
    }

    .nav-links a {
      color: #ccd6f6;
      transition: 0.3s;
    }

    .nav-links a:hover {
      color: #64ffda;
    }

    /* Hero */
    .hero {
      min-height: 90vh;
      display: flex;
      align-items: center;
    }

    .hero-content {
      max-width: 750px;
    }

    .hero small {
      color: #64ffda;
      font-size: 1rem;
    }

    .hero h1 {
      font-size: clamp(3rem, 8vw, 5rem);
      color: #ccd6f6;
      margin: 10px 0;
    }

    .hero h2 {
      font-size: clamp(1.8rem, 4vw, 3rem);
      color: #8892b0;
      margin-bottom: 20px;
    }

    .hero p {
      max-width: 650px;
      color: #8892b0;
      font-size: 1.1rem;
      margin-bottom: 30px;
    }

    .buttons {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-block;
      padding: 12px 22px;
      border: 1px solid #64ffda;
      color: #64ffda;
      border-radius: 5px;
      transition: 0.3s;
    }

    .btn:hover {
      background: rgba(100, 255, 218, 0.1);
      transform: translateY(-2px);
    }

    .btn-primary {
      background: #64ffda;
      color: #0a192f;
      font-weight: bold;
    }

    .btn-primary:hover {
      background: #52d9b8;
    }
     /* Contact */
    .contact {
      text-align: center;
      max-width: 700px;
      margin: auto;
    }

    .contact p {
      color: #8892b0;
      margin-bottom: 30px;
    }

    .contact-email {
      display: inline-block;
      font-size: 1.5rem;
      color: #64ffda;
      margin-bottom: 30px;
    }

    /* Footer */
    footer {
      text-align: center;
      padding: 30px;
      border-top: 1px solid #233554;
      color: #8892b0;
      font-size: 0.9rem;
    }


 /* Mobile */
    @media (max-width: 768px) {

      .nav-links {
        display: none;
      }

      .hero {
        min-height: 80vh;
      }

      .about {
        grid-template-columns: 1fr;
      }

      .projects {
        grid-template-columns: 1fr;
      }

      section {
        padding: 70px 0;
      }

      .hero h1 {
        font-size: 3rem;
      }
    }
  </style>
</head>

  

 <!-- Contact -->
    <section id="contact">

      <div class="container contact">

        <h2 class="section-title">
          <span>05.</span> Contact
        </h2>

        <p>
          I'm currently open to new opportunities and interesting
          projects. If you'd like to work together, feel free to
          reach out.
        </p>

        <a
          href="mailto:Kuissulareine@gmail.com"
          class="contact-email"
        >
          Kuissulareine@gmail.com
        </a>

        <br>

        <a href="mailto:Kuissulareine@gmail.com" class="btn">
          Get In Touch
        </a>

      </div>

    </section>

  </main>


  <!-- Footer -->
  <footer>

    <p>
      Designed & Built by KUISSU
    </p>

    <p>
      © 2026 KUISSU
    </p>

  </footer>

</body>
</html>
